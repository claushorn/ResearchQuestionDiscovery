<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research pipeline{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="top">
  <span class="name">Research pipeline</span>
  <nav class="tabs">
    {% for href, label in nav %}<a href="{{ href }}"{% if request.url.path == href or (href != '/' and request.url.path.startswith(href)) %} class="current"{% endif %}>{{ label }}</a>{% endfor %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="task-panel">{% block task_panel %}{% endblock %}</div>
</body>
</html>
