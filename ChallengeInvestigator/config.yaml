leaderboard_sources:               # SourceScout source id -> leaderboard scraper; other sources: headroom not_applicable
  aicrowd-completed: aicrowd
  drivendata: drivendata
metric_bounds:                     # ceiling by the metric's DEFINITION (matched in the leaderboard's metric name, first
                                   # match wins); metrics not listed stay "unclear" — add one only if its definition bounds it
  - {match: "log ?loss|logloss|cross.?entropy", direction: lower_is_better, ceiling: 0, definition: "log loss is at least 0"}
  - {match: "\\berror\\b|\\brmse\\b|\\bmae\\b|\\bmse\\b|\\bwer\\b|\\bcer\\b", direction: lower_is_better, ceiling: 0,
     definition: "an error (RMSE, MAE, error rate) is at least 0"}
  - {match: "centipawn|\\bacpl\\b", direction: lower_is_better, ceiling: 0, definition: "centipawn loss against the engine's best move is at least 0"}
  - {match: "accuracy|auroc|\\bauc\\b|\\bf1\\b|f-score|\\biou\\b|jaccard|dice|\\bmap\\b|mean average precision|precision|recall",
     direction: higher_is_better, ceiling: 1, definition: "the metric is at most 1"}
  - {match: "mean normalized reward", direction: higher_is_better, ceiling: 1,
     definition: "Procgen normalizes each game's return as (R - R_min) / (R_max - R_min), so the mean is at most 1"}
baseline_agent:                    # only when a lower-is-better leaderboard lists no baseline: look it up (verified quote)
  model: claude-opus-5-5
  effort: low
  max_budget_usd: 0.3
  min_searches: 1
investigate_agent:                 # solutions + improvement ideas (only for challenges you pick)
  model: claude-opus-5-5
  effort: medium
  max_budget_usd: 2.0
  min_searches: 4
headroom_threshold: 0.10           # normalized headroom below this = "solved" (not worth beating)
http:                              # leaderboards, and cited evidence for quote verification
  user_agent: "RQD-ChallengeInvestigator/0.1 (research evidence verification)"
  timeout_s: 30
  min_interval_s_per_host: 2.0
sourcescout_root: ../SourceScout   # finished challenges are read from its store (data/scout.db)
