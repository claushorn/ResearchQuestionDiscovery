[project]
name = "sourcescout"
version = "0.1.0"
description = "Collects newly exposed, paid-for technical problems from funded calls, job boards and industry sources"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.13",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
sourcescout = "sourcescout.cli:app"
problemextractor = "problemextractor.cli:app"
noveltyinvestigator = "noveltyinvestigator.cli:app"
economicvalue = "economicvalue.cli:app"
challenges = "challengeinvestigator.cli:app"
fit = "personalfit.cli:app"
opportunities = "opportunitygenerator.cli:app"
frontend = "frontend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common/rqd", "SourceScout/sourcescout", "ProblemExtractor/problemextractor", "NoveltyInvestigator/noveltyinvestigator", "EconomicValueInvestigator/economicvalue", "ChallengeInvestigator/challengeinvestigator", "PersonalFitInvestigator/personalfit", "OpportunityGenerator/opportunitygenerator", "Frontend/frontend"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "SourceScout/tests", "ProblemExtractor/tests", "NoveltyInvestigator/tests", "EconomicValueInvestigator/tests", "ChallengeInvestigator/tests", "PersonalFitInvestigator/tests", "OpportunityGenerator/tests", "Frontend/tests"]
pythonpath = ["common/tests"]
markers = ["live: hits the real network and the Anthropic API"]
addopts = "-m 'not live'"

[tool.uv]
dev-dependencies = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
