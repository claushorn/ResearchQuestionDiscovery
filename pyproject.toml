[project]
name = "sourcescout"
version = "0.1.0"
description = "Collects newly exposed, paid-for technical problems from funded calls, job boards and industry sources"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.13",
    "typer>=0.27.2",
]

[project.scripts]
sourcescout = "sourcescout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common/rqd", "SourceScout/sourcescout", "ProblemExtractor/problemextractor"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "SourceScout/tests", "ProblemExtractor/tests"]
pythonpath = ["common/tests"]
markers = ["live: hits the real network and the Anthropic API"]
addopts = "-m 'not live'"

[tool.uv]
dev-dependencies = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
