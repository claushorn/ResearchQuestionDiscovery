- id: sbir-topics
  name: SBIR.gov open topics
  category: gov_solicitation
  kind: html_list
  url: https://www.sbir.gov/topics?status=1
  params:
    link_selector: a[href^="/topics/"]
    max_items: 40
- id: arpa-h-programs
  name: ARPA-H programs and initiatives
  category: gov_solicitation
  kind: html_list
  url: https://arpa-h.gov/explore-funding/open-funding-opportunities
  params:
    link_selector: a[href]
    link_pattern: /explore-funding/(programs|initiatives-and-sprints)/[^/]+$
- id: aria-programmes
  name: ARIA opportunity-space programmes
  category: gov_solicitation
  kind: html_list
  url: https://aria.org.uk/opportunity-spaces
  params:
    link_selector: a[href^="/opportunity-spaces/"]
    link_pattern: /opportunity-spaces/[^/]+/[^/]+$
- id: drivendata
  name: DrivenData competitions
  category: challenge_platform
  kind: html_list
  url: https://www.drivendata.org/competitions/
  params:
    link_selector: a[href^="/competitions/"]
    link_pattern: /competitions/\d+/[^/]+/?$
    max_items: 20
    finished_after_heading: (?i)completed competitions
- id: aicrowd
  name: AIcrowd challenges
  category: challenge_platform
  kind: html_list
  url: https://www.aicrowd.com/challenges?challenge_filter=active
  params:
    link_selector: a[href^="/challenges/"]
    link_pattern: /challenges/[^/]+$
    max_items: 20
    finished_link_text: (?i)\b(ended|closed|completed|finished)\b
- id: aicrowd-completed
  name: AIcrowd challenges (completed)
  category: challenge_platform
  kind: html_list
  url: https://www.aicrowd.com/challenges?challenge_filter=completed
  params:
    link_selector: a[href^="/challenges/"]
    link_pattern: /challenges/[^/]+$
    max_items: 20
    finished_link_text: (?i)\b(ended|closed|completed|finished)\b
    finished_listing: true
- id: proteinbase-competitions
  name: Adaptyv / Proteinbase protein-design competitions
  category: challenge_platform
  kind: html_list
  url: https://proteinbase.com/competitions
  params:
    link_selector: a[href^="/competitions/"]
    link_pattern: /competitions/[^/]+$
    finished_link_text: (?i)\b(ended|closed|completed|finished)\b
