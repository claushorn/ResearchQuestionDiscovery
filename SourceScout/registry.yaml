# --- industry talks: what named companies work on (category industry_talk; one item per talk)
- id: talk-databricks-dais
  name: Databricks Data + AI Summit sessions
  category: industry_talk
  kind: json_sessions
  url: https://www.databricks.com/dataaisummit/agenda
  params:
    embedded: script#__NEXT_DATA__
    items_path: props.pageProps.agenda.sessions
    title_field: title
    text_fields: [body, speakers.*.company, speakers.*.job_title, categories.industry]
    url_field: path
    max_items: 200
- id: talk-aie-worldsfair-2026
  name: AI Engineer World's Fair 2026 sessions
  category: industry_talk
  kind: json_sessions
  url: https://ai.engineer/worldsfair/2026/sessions.json
  params:
    items_path: sessions
    title_field: title
    text_fields: [description, speakers, track]
    date_field: day
    max_items: 200
- id: talk-pydata-london-2026
  name: PyData London 2026 talks
  category: industry_talk
  kind: json_sessions
  url: https://pretalx.com/pydata-london-2026/schedule/export/schedule.json
  params: &pretalx
    items_path: schedule.conference.days.*.rooms.*.*
    title_field: title
    text_fields: [abstract, description, persons.*.biography]
    url_field: url
    date_field: date
    max_items: 200
