- id: arpa-h-programs
  name: ARPA-H programs and initiatives
  category: gov_solicitation
  kind: html_list
  url: https://arpa-h.gov/explore-funding/open-funding-opportunities
  params:
    link_selector: a[href]
    link_pattern: /explore-funding/(programs|initiatives-and-sprints)/[^/]+$
