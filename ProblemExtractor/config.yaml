extraction:
  backend: claude_code             # claude_code: `claude -p` on your Claude subscription | api: ANTHROPIC_API_KEY
  model: claude-opus-5-5
  effort: high                     # PE adds value: sharper statements, merge judgement, labelled expert knowledge
  max_tokens: 8000                 # hard stop per request (api backend)
  token_budget: 2000               # reported limit, output tokens/candidate: ~1.5x median at high effort (measured median 1297, p90 1752)
  shortlist_size: 5                # most similar existing problems offered for merging
sourcescout_root: ../SourceScout   # candidates (output/) and item texts (data/scout.db) come from here
