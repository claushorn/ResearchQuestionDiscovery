extraction:
  backend: claude_code             # claude_code: `claude -p` on your Claude subscription | api: ANTHROPIC_API_KEY
  model: claude-opus-5-5
  effort: low
  max_tokens: 4000                 # hard stop per request (api backend)
  token_budget: 600                # output tokens per candidate; reported as a violation when exceeded
  shortlist_size: 5                # most similar existing problems offered for merging
sourcescout_root: ../SourceScout   # candidates (output/) and item texts (data/scout.db) come from here
